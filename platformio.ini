; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit docs.platformio.org/page/projectconf.html for more information.

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<*> -<esp32/>
lib_deps = 
	arduino-libraries/SD @ ^1.3.0
	adafruit/Adafruit Thermal Printer Library @ ^1.4.1

; Основная прошивка: ESP32 + Wi-Fi + HTTP API + веб-интерфейс.
; Принтер подключён к UART2 (GPIO16/17) и DTR (GPIO4).
[env:esp32dev]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<esp32/>
lib_deps =
	bblanchon/ArduinoJson @ ^7.0.0
	tzapu/WiFiManager @ ^2.0.17

; Обновление по Wi-Fi: pio run -e esp32dev_ota -t upload
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = thermal.local
